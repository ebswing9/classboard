<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>학급대시보드</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f78fb3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="학급대시보드">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<style>
  :root{
    --bg1:#fdf3f6; --bg2:#eef1fd; --bg3:#fbf6e9;
    --card:#ffffff;
    --pink:#ffd3e0; --pink-deep:#f78fb3;
    --mint:#c8f0e2; --mint-deep:#4fbe9c;
    --lav:#e2dcfb; --lav-deep:#9b7fea;
    --yellow:#fff0bf; --yellow-deep:#f0b93a;
    --sky:#d3ecfb; --sky-deep:#79b3ec;
    --text:#4a4458; --muted:#a79fc0; --line:#f2ebf7;
    --shadow: 0 10px 28px rgba(160,140,190,0.16);
    --vh: 1vh;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0;padding:0;height:100%; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--text); overflow-y:auto; overflow-x:hidden; overscroll-behavior:none; touch-action:pan-x pan-y; -webkit-overflow-scrolling:touch; }
  body{
    background: radial-gradient(circle at 8% 12%, var(--pink) 0%, transparent 32%),
                radial-gradient(circle at 92% 15%, var(--sky) 0%, transparent 34%),
                radial-gradient(circle at 15% 90%, var(--yellow) 0%, transparent 30%),
                radial-gradient(circle at 88% 88%, var(--lav) 0%, transparent 34%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment: fixed;
  }
  /* 전자칠판 등 100vh 계산이 어긋나는 기기를 위한 안전장치:
     콘텐츠가 화면보다 넘치면 자동으로 스크롤을 허용해서 하단이 잘려서 클릭 안 되는 일이 없도록 함 */
  body.force-scroll{ overflow-y:auto; overflow-x:hidden; }
  body.force-scroll #app{ height:auto; min-height:calc(var(--vh, 1vh) * 100); }

  #app{ height:calc(var(--vh, 1vh) * 100); padding:22px; display:flex; }
  #board{ flex:1; display:flex; flex-direction:column; gap:18px; min-height:0; }

  .headfont{ font-family:'Jua',sans-serif; font-weight:400; }
  .icon-svg{ display:inline-flex; vertical-align:-0.15em; }
  .icon-svg svg{ display:block; }
  .label{ font-size:19px; color:var(--text); display:flex; align-items:center; gap:8px; margin-bottom:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card{
    position:relative; background:var(--card); border-radius:26px; padding:20px 22px;
    display:flex; flex-direction:column; min-height:0; box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,0.6);
  }

  #mainRow{ flex:1; display:flex; gap:18px; min-height:0; }

  #sidePanel{ width:0; padding:0; overflow:hidden; flex-shrink:0; transition:width .32s cubic-bezier(.4,0,.2,1); background:var(--card); }
  #sidePanel.open{ width:440px; padding:22px 24px; }
  #sidePanelInner{ width:392px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
  .panel-header-title{ display:flex; align-items:center; gap:8px; min-width:0; }
  .panel-header h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:22px; margin:0; color:var(--pink-deep); }
  .panel-close{ background:var(--line); border:none; width:32px; height:32px; border-radius:50%; color:var(--text); font-size:15px; cursor:pointer; flex-shrink:0; }
  #panelBody{ flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; }

  /* 조회/종례 - 체크박스형 항목 */
  .notice-list{ display:flex; flex-direction:column; gap:10px; }
  .notice-item{ display:flex; align-items:flex-start; gap:12px; background:var(--line); padding:14px 16px; border-radius:16px; }
  .cute-checkbox{ position:relative; display:inline-flex; flex-shrink:0; margin-top:1px; cursor:pointer; width:24px; height:24px; }
  .cute-checkbox input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .cute-checkbox .box{ width:24px; height:24px; border-radius:9px; background:#fff; border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s, transform .1s; box-shadow:0 2px 4px rgba(160,140,190,0.15); }
  .cute-checkbox input:active ~ .box{ transform:scale(0.9); }
  .cute-checkbox .check-icon{ width:14px; height:14px; opacity:0; transform:scale(0.4); transition:opacity .15s, transform .15s; }
  .cute-checkbox input:checked ~ .box .check-icon{ opacity:1; transform:scale(1); }
  .cute-checkbox.morning .box{ border-color:var(--yellow-deep); }
  .cute-checkbox.morning input:checked ~ .box{ background:var(--yellow-deep); }
  .cute-checkbox.closing .box{ border-color:var(--lav-deep); }
  .cute-checkbox.closing input:checked ~ .box{ background:var(--lav-deep); }
  .notice-item-text{ font-size:17px; font-weight:600; line-height:1.55; }
  .notice-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:50px 10px; color:var(--muted); font-weight:600; text-align:center; }
  .notice-empty .e-icon{ font-size:40px; }

  .att-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .att-cell{ background:var(--line); border-radius:16px; padding:12px 12px; display:flex; flex-direction:column; gap:8px; }
  .att-cell .att-name-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .att-cell .att-name-group{ display:flex; align-items:baseline; gap:4px; min-width:0; }
  .att-cell .att-name{ font-size:15px; font-weight:800; }
  .att-cell .att-rank{ font-size:10px; font-weight:800; color:var(--pink-deep); }
  .att-cell .att-time{ font-size:11.5px; font-weight:700; color:var(--mint-deep); }
  .att-cell .att-btns{ display:flex; gap:6px; }
  .att-absent-label{ color:#e0556f; font-weight:800; font-size:14px; text-align:center; padding:4px 0; }
  .att-pill{ flex:1; border:none; background:#fff; color:var(--text); padding:8px 6px; border-radius:14px; font-size:13px; font-weight:700; cursor:pointer; }
  .att-pill.on-present{ background:var(--mint-deep); color:#fff; }
  .att-pill.on-out{ background:var(--sky-deep); color:#fff; }

  #clockCard{ flex:1 1 480px; min-width:280px; align-items:center; text-align:center; justify-content:center; background:linear-gradient(155deg, #fff, var(--pink) 180%); }
  #timetableCard{ flex:0 1 260px; min-width:160px; background:linear-gradient(180deg, var(--pink) -120%, #fff 50%, var(--yellow) 220%); }
  #todayPeriodList{ list-style:none; margin:0; padding:0; flex:1.7; overflow:hidden; display:flex; flex-direction:column; gap:6px; min-width:0; min-height:0; }
  .tt-divider{ height:1px; background:rgba(90,169,221,0.25); margin:10px 0; flex-shrink:0; }
  .meal-section{ flex:0.6; display:flex; flex-direction:column; min-height:0; }
  .meal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-shrink:0; }
  .meal-label{ font-size:16px; color:var(--text); }
  .meal-nav{ display:flex; gap:4px; }
  .meal-nav button{ border:none; background:rgba(255,255,255,0.7); color:var(--sky-deep); width:24px; height:24px; border-radius:8px; font-size:13px; font-weight:800; cursor:pointer; }
  .meal-nav button#mealTodayBtn{ width:auto; padding:0 8px; font-size:11px; }
  #mealDateLabel{ font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; flex-shrink:0; }
  #mealBody{ flex:1; overflow-y:auto; min-height:0; }
  .meal-list{ list-style:none; margin:0; padding:0; font-size:13.5px; font-weight:600; line-height:1.6; }
  .meal-empty, .meal-loading{ color:var(--muted); font-size:13px; font-weight:600; text-align:center; padding:14px 4px; }
  #quizCard{ flex:0 1 520px; min-width:300px; background:linear-gradient(160deg, #fff, var(--sky) 230%); position:relative; overflow:hidden; }

  #clockTime{ font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(52px, 6vw, 108px); line-height:1; color:var(--text); font-variant-numeric:tabular-nums; }
  #clockDate{ font-size:21px; font-weight:700; color:var(--pink-deep); margin-top:10px; }
  #clockDday{ font-size:14px; font-weight:600; color:var(--muted); margin-top:6px; }
  #ddayWidget{ font-family:'Jua',sans-serif; font-size:15px; color:var(--lav-deep); margin-top:14px; background:var(--lav); padding:8px 18px; border-radius:20px; display:none; }

  #quickBtnRow{ display:flex; gap:10px; margin-top:22px; }

  /* 출석률 위젯 */
  #attendanceWidget{ width:100%; max-width:360px; margin-top:20px; }
  .att-rate-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
  .att-rate-label{ font-size:14px; color:var(--mint-deep); display:flex; align-items:center; gap:5px; }
  .att-rate-percent{ font-family:'Jua',sans-serif; font-weight:400; font-size:17px; color:var(--mint-deep); }
  .att-rate-bar-track{ width:100%; height:16px; background:var(--line); border-radius:20px; box-shadow:inset 0 1px 4px rgba(160,140,190,0.2); position:relative; }
  .att-rate-bar-fill{ height:100%; border-radius:20px; background:linear-gradient(90deg, var(--mint-deep), var(--sky-deep)); transition:width .6s cubic-bezier(.4,0,.2,1); position:relative; min-width:16px; }
  .att-rate-bar-fill::after{ content:"🐣"; position:absolute; right:-6px; top:50%; transform:translateY(-50%); font-size:15px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  #attendanceWidget.clap-ready .att-rate-bar-track{ cursor:pointer; }
  #attendanceWidget.full .att-rate-bar-fill{ background:linear-gradient(90deg, var(--yellow-deep), var(--pink-deep)); }
  #attendanceWidget.clap-ready .att-rate-bar-fill{ animation:attPulse 1.6s ease-in-out infinite; }
  #attendanceWidget.full .att-rate-bar-fill::after{ content:"🎉"; }
  @keyframes attPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.15); } }
  .att-rate-unchecked{ margin-top:7px; font-size:12px; font-weight:600; color:var(--muted); text-align:right; min-height:15px; }

  /* 오늘의 할 일 */
  #todoSection{ width:100%; max-width:360px; margin-top:32px; display:none; flex-direction:column; }
  #todoSection.show{ display:flex; }
  .todo-title{ font-size:16px; color:var(--pink-deep); margin-bottom:12px; text-align:left; }
  .todo-list{ display:flex; flex-direction:column; gap:10px; }
  .todo-row{ display:flex; align-items:center; gap:11px; }
  .todo-text{ flex:1; font-size:15px; font-weight:600; color:var(--text); text-align:left; min-height:1.4em; }
  .todo-text .todo-sub{ font-size:60%; font-weight:500; color:var(--muted); }
  .cute-checkbox.todo .box{ border-color:var(--pink-deep); }
  .cute-checkbox.todo input:checked ~ .box{ background:var(--pink-deep); }
  .quick-btn{
    cursor:pointer; border:none; color:var(--text); padding:12px 16px; border-radius:20px;
    font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px;
    transition:transform .12s, filter .15s, box-shadow .15s; box-shadow:0 4px 10px rgba(160,140,190,0.16);
  }
  .quick-btn:hover{ filter:brightness(1.04); transform:translateY(-2px); }
  .quick-btn:active{ transform:scale(0.97); }
  .quick-btn.active{ box-shadow:0 0 0 3px rgba(255,255,255,0.9), 0 4px 12px rgba(160,140,190,0.3); transform:translateY(-1px); }
  #attendTile{ background:var(--mint); }
  #morningTile{ background:var(--yellow); }
  #closingTile{ background:var(--pink); }

  #todayPeriodList{ list-style:none; margin:0; padding:0; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .period-chip{ flex:1; min-height:0; border-radius:14px; padding:4px 12px; display:flex; align-items:center; justify-content:center; gap:9px; font-weight:700; font-size:16px; min-width:0; overflow:hidden; }
  .p-badge{ width:24px; height:24px; min-width:24px; border-radius:50%; background:rgba(255,255,255,0.75); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; font-family:'Jua',sans-serif; color:var(--text); flex-shrink:0; }
  .p-subject{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .tt-empty{ color:var(--muted); font-weight:600; font-size:13px; text-align:center; }

  #quizCard::before{ content:"?"; position:absolute; font-family:'Jua',sans-serif; font-size:220px; color:rgba(121,179,236,0.09); right:-30px; bottom:-56px; line-height:1; pointer-events:none; user-select:none; }
  .quiz-inner{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:6px 10px; }
  .quiz-icon{ transition: font-size .32s ease; }
  .quiz-question, .quiz-image, .quiz-choices{ transition: opacity .25s ease, max-height .32s ease, margin .32s ease; max-height:600px; opacity:1; overflow:hidden; }
  .quiz-submit-btn{ transition: font-size .3s ease, padding .3s ease, transform .12s ease, filter .15s ease; }
  #quizCard.squished{ cursor:pointer; }
  #quizCard.squished .quiz-question,
  #quizCard.squished .quiz-image,
  #quizCard.squished .quiz-choices{ opacity:0; max-height:0; margin:0; }
  #quizCard.squished::before{ display:none; }
  #quizCard.squished .quiz-icon{ font-size:22px; }
  #quizCard.squished .quiz-submit-btn{ font-size:12px; padding:8px 12px; white-space:normal; }
  .quiz-icon{ font-size:30px; }
  .quiz-question{ font-size:clamp(22px, 2.8vw, 34px); font-weight:800; line-height:1.4; max-height:100%; overflow-y:auto; }
  .quiz-image{ max-width:min(100%, 320px); max-height:220px; border-radius:16px; box-shadow:0 6px 18px rgba(74,68,88,0.18); object-fit:contain; }
  .quiz-choices{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px; margin:0 auto; }
  .quiz-choice{ background:rgba(255,255,255,0.85); border-radius:14px; padding:12px 18px; font-size:16px; font-weight:700; text-align:left; display:flex; align-items:center; gap:10px; box-shadow:0 2px 6px rgba(74,68,88,0.06); }
  .quiz-choice .qc-num{ width:20px; height:20px; min-width:20px; border-radius:50%; background:var(--sky-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; font-family:'Jua',sans-serif; }
  .quiz-submit-btn{ position:relative; margin-top:4px; border:none; background:var(--sky-deep); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 10px rgba(121,179,236,0.3); }
  .quiz-submit-btn:hover{ filter:brightness(1.06); }

  #configErrorBanner{ position:fixed; top:0; left:0; right:0; background:#e0556f; color:#fff; padding:16px 22px; font-size:15px; font-weight:700; z-index:999; display:none; }

  /* 그리기 답안 제출 - 화면 하단 중앙에 작게, 배경 안 가림 */
  #drawOverlay{ position:fixed; left:50%; bottom:26px; z-index:200; opacity:0; visibility:hidden; transform:translateX(-50%) translateY(14px); transition:opacity .22s ease, transform .22s ease, visibility 0s linear .22s; }
  #drawOverlay.open{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); transition:opacity .22s ease, transform .22s ease, visibility 0s; }
  .draw-box{ width:220px; background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 12px 32px rgba(74,68,88,0.28); position:relative; border:1px solid rgba(255,255,255,0.6); transition:width .2s ease; }
  .draw-box.wide{ width:min(92vw, 480px); }
  .draw-box h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:13px; color:var(--sky-deep); margin:0 0 8px; text-align:center; }
  .close-x{ position:absolute; top:6px; right:6px; background:var(--line); border:none; width:20px; height:20px; border-radius:50%; color:var(--text); font-size:10px; cursor:pointer; }
  .name-grid{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-height:60vh; overflow-y:auto; }
  .name-pill{ border:none; background:var(--sky); color:var(--text); padding:6px 10px; border-radius:12px; font-size:11.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:3px; }
  .name-pill:hover{ background:var(--sky-deep); color:#fff; }
  .name-pill.done{ background:var(--line); color:var(--muted); cursor:default; opacity:.55; }
  .name-pill.done:hover{ background:var(--line); color:var(--muted); }
  .name-pill .pill-hearts{ font-size:9.5px; letter-spacing:-1px; }
  #drawCanvas{ width:100%; height:70px; border-radius:10px; background:#fff; border:2px solid var(--line); touch-action:none; display:block; }
  .draw-actions{ display:flex; align-items:center; gap:5px; margin-top:8px; }
  .draw-btn{ border:none; background:var(--line); color:var(--text); padding:7px 10px; border-radius:10px; font-size:11px; font-weight:700; cursor:pointer; }
  .draw-btn.primary{ background:var(--sky-deep); color:#fff; flex:1; padding:8px 10px; font-size:12px; }
  .draw-done{ text-align:center; font-size:14px; font-weight:800; padding:10px 0; font-family:'Jua',sans-serif; color:var(--mint-deep); }

  /* 포인트 축하 토스트 */
  #pointToast{ position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-16px); background:linear-gradient(135deg, var(--pink-deep), var(--yellow-deep)); color:#fff; font-family:'Jua',sans-serif; font-size:16px; padding:14px 28px; border-radius:20px; box-shadow:0 12px 28px rgba(160,140,190,0.4); opacity:0; pointer-events:none; transition:opacity .35s ease, transform .35s ease; z-index:999; text-align:center; white-space:nowrap; }
  #pointToast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 오늘의 행운번호: 작은 아이콘 버튼 + 모달 팝업 */
  #luckyDrawIconBtn{ width:30px; height:30px; min-width:30px; border-radius:50%; border:none; background:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 6px rgba(160,140,190,0.18); transition:transform .12s ease; padding:0; }
  #luckyDrawIconBtn:hover{ transform:scale(1.08); }
  #luckyDrawIconBtn:active{ transform:scale(0.92); }
  #luckyDrawOverlay{ position:fixed; inset:0; background:rgba(74,68,88,0.32); display:flex; align-items:center; justify-content:center; z-index:300; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s; }
  #luckyDrawOverlay.open{ opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s; }
  .lucky-modal{ width:min(88vw, 360px); background:linear-gradient(160deg, #fff, var(--yellow) 220%); border-radius:24px; padding:28px 24px; text-align:center; box-shadow:0 20px 48px rgba(74,68,88,0.3); position:relative; }
  .lucky-modal .close-x{ position:absolute; top:10px; right:10px; }
  .lucky-modal h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:16px; color:var(--pink-deep); margin:0 0 16px; }
  .lucky-modal .lucky-emoji{ font-size:46px; transition:transform .1s ease; }
  .lucky-modal .lucky-emoji.spinning{ animation: luckySpin .12s linear infinite; }
  @keyframes luckySpin{ 0%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.15);} 100%{transform:rotate(360deg) scale(1);} }
  .lucky-modal .lucky-draw-btn{ margin-top:16px; border:none; background:var(--pink-deep); color:#fff; padding:11px 22px; border-radius:16px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Jua',sans-serif; }
  .lucky-modal .lucky-draw-btn:disabled{ background:var(--muted); cursor:default; opacity:.6; }
  .lucky-modal .lucky-draw-result{ font-family:'Jua',sans-serif; font-size:16px; color:var(--text); margin-top:14px; line-height:1.6; }
  .lucky-modal .lucky-draw-result b{ color:var(--pink-deep); font-size:20px; }
  .lucky-modal .lucky-draw-hint{ font-size:11.5px; color:var(--muted); font-weight:600; margin-top:10px; }

  /* 진짜 좁은 화면(휴대폰)에서만 세로 스택으로 전환.
     전자칠판처럼 중간 폭의 화면은 아래 카드들의 min-width 덕분에 가로 배치를 유지한 채
     알아서 줄어들도록 만들어서(스택 전환 X), "전자칠판이 모바일처럼 보이는" 문제를 피함. */
  @media (max-width: 820px){
    html,body{ overflow:auto; height:auto; }
    #app{ height:auto; min-height:100vh; padding:14px; }
    #board{ gap:14px; }
    #mainRow{ flex-direction:column; height:auto; }

    #clockTime{ font-size:clamp(48px, 14vw, 80px); }
  }
</style>
</head>

<script>
const DAYS_KR = ['일','월','화','수','목','금','토'];
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEK_KEYS = ['mon','tue','wed','thu','fri'];
const CHIP_COLORS = ['pink','mint','yellow','lav','sky'];
function todayStr(d=new Date()){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStrCompact(d=new Date()){ return todayStr(d).replaceAll('-',''); }
function nowHHMM(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 포인트 시스템 ---------- */
function awardPoints(studentId, delta){
  return db.ref(`points/${studentId}`).transaction(cur => (cur||0) + delta);
}
// 하루 출석 포인트가 "정확히 1번만" 지급되도록 하는 정산 함수.
// 대시보드/관리자 어느 쪽에서 체크·해제하든 이 함수를 거치면
// 실제 지급 여부(pointLedger)를 현재 출석 기록과 항상 맞춰준다.
async function reconcileAttendancePoint(date, studentId){
  const [recSnap, ledgerSnap] = await Promise.all([
    db.ref(`attendance/${date}/${studentId}`).once('value'),
    db.ref(`pointLedger/attendance/${date}/${studentId}`).once('value')
  ]);
  const rec = recSnap.val();
  const shouldHave = !!(rec && rec.status === 'present' && rec.source === 'dashboard');
  const already = !!ledgerSnap.val();
  if(shouldHave && !already){
    await awardPoints(studentId, +1);
    await db.ref(`pointLedger/attendance/${date}/${studentId}`).set(true);
  } else if(!shouldHave && already){
    await awardPoints(studentId, -1);
    await db.ref(`pointLedger/attendance/${date}/${studentId}`).set(false);
  }
}
function showPointToast(html){
  const el = document.getElementById('pointToast');
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(showPointToast._t);
  showPointToast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}
// 상점(10점 보상) 지급 완료 후, 학생이 다음 번 답안 제출/출석 체크를 할 때 최초 1번만 축하 토스트를 띄움
async function checkAndCelebrateReward(studentId, studentName){
  try{
    const snap = await db.ref(`pointMeta/${studentId}/pendingCelebrate`).once('value');
    if(snap.val()){
      await db.ref(`pointMeta/${studentId}/pendingCelebrate`).set(false);
      showPointToast(`🎉 ${escapeHtml(studentName)}님, 10점 모아 상점 받았어요! 🎉`);
    }
  }catch(e){ console.error('reward celebration check error', e); }
}
// 포인트 → 하트 뱃지 문자열 (10점당 하트 1개, 100점 이상이면 특별 아이콘 1개로 표시)
function pointsToHearts(points){
  const p = points || 0;
  if(p >= 100) return '🌟';
  const n = Math.min(9, Math.floor(p/10));
  return n > 0 ? '❤️'.repeat(n) : '';
}

let db;

function initFirebase(){
  const banner = document.getElementById('configErrorBanner');
  if(typeof DASHBOARD_FIREBASE_CONFIG === 'undefined' || !DASHBOARD_FIREBASE_CONFIG.apiKey){
    banner.textContent = '⚠️ firebase.js를 찾지 못했거나 설정값이 비어있어요. index.html과 같은 폴더에 firebase.js가 올라가 있는지 확인해주세요.';
    banner.style.display = 'block';
    return false;
  }
  if(!db){
    const dashboardApp = firebase.initializeApp(DASHBOARD_FIREBASE_CONFIG, 'dashboard');
    db = dashboardApp.database();
  }
  return true;
}

/* ---------- 전자칠판에서 여러 명이 동시에 터치할 때 확대(핀치줌/더블탭줌) 방지 ----------
   이전에는 touchmove에서 손가락 2개 이상이면 무조건 preventDefault 했었는데,
   이 방식이 스크롤(특히 2손가락 스크롤)까지 같이 막아버리는 부작용이 있었음.
   그래서 표준 CSS touch-action으로 교체: "pan-x pan-y"는 스크롤(가로/세로 이동)은 허용하고
   확대축소(핀치줌·더블탭줌)만 막아줌 — html,body의 touch-action 선언이 그 역할을 함. */
(function preventPinchAndDoubleTapZoom(){
  // Safari 계열은 touch-action만으로 안 막히는 경우가 있어, 제스처 확대 이벤트 자체를 추가로 막음
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  // 마우스가 연결된 전자칠판에서 Ctrl+휠 확대도 막음
  document.addEventListener('wheel', function(e){
    if(e.ctrlKey) e.preventDefault();
  }, { passive:false });
})();

/* ---------- 전자칠판 등 100vh 오차 보정 + 넘침 안전장치 ---------- */
function setVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', ()=> setTimeout(setVH, 250));

function checkOverflowFallback(){
  requestAnimationFrame(()=>{
    const overflowing = document.documentElement.scrollHeight > window.innerHeight + 4;
    document.body.classList.toggle('force-scroll', overflowing);
  });
}
window.addEventListener('resize', checkOverflowFallback);
window.addEventListener('load', ()=> setTimeout(checkOverflowFallback, 600));
setInterval(checkOverflowFallback, 4000);

function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent = [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  document.getElementById('clockDate').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS_KR[now.getDay()]})`;
  const hour = now.getHours();
  document.getElementById('clockDday').textContent = hour<9 ? '좋은 아침이에요 ☀️' : (hour<15 ? '오늘도 힘차게 📖' : '수고 많았어요 🌙');
}
setInterval(tickClock,1000); tickClock();

/* ---------- 사이드 패널 ---------- */
const sidePanel = document.getElementById('sidePanel');
const quizCardEl = document.getElementById('quizCard');
let openPanelType = null;

function closePanel(){
  sidePanel.classList.remove('open');
  quizCardEl.classList.remove('squished');
  openPanelType = null;
  document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('luckyDrawIconBtn').style.display = 'none';
}
document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
quizCardEl.addEventListener('click', (e)=>{
  if(!quizCardEl.classList.contains('squished')) return;
  if(e.target.closest('#openDrawBtn')) return;
  closePanel();
});

async function openPanel(type){
  if(openPanelType === type){ closePanel(); return; }
  openPanelType = type;
  document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(type==='attendance' ? 'attendTile' : (type==='morning' ? 'morningTile' : 'closingTile')).classList.add('active');
  sidePanel.classList.add('open');
  quizCardEl.classList.add('squished');

  if(type==='attendance'){
    document.getElementById('panelTitle').textContent = '🙋 출결 체크';
    document.getElementById('luckyDrawIconBtn').style.display = 'flex';
    await renderAttendancePanel();
  } else if(type==='morning'){
    document.getElementById('panelTitle').textContent = '📣 조회사항';
    document.getElementById('luckyDrawIconBtn').style.display = 'none';
    await renderNoticePanel('morning');
  } else {
    document.getElementById('panelTitle').textContent = '🌇 종례사항';
    document.getElementById('luckyDrawIconBtn').style.display = 'none';
    await renderNoticePanel('closing');
  }
  checkOverflowFallback();
}
document.getElementById('attendTile').addEventListener('click', ()=> openPanel('attendance'));
document.getElementById('morningTile').addEventListener('click', ()=> openPanel('morning'));
document.getElementById('closingTile').addEventListener('click', ()=> openPanel('closing'));

/* 조회/종례: 빈 줄로 항목을 구분, 항목 안에서의 줄바꿈은 그대로 <br>로 유지 (체크박스 1개 = 빈 줄로 구분된 1개 문단) */
function renderNoticeList(text, which){
  const items = text.split(/\n[ \t]*\n+/).map(s=>s.trim()).filter(Boolean);
  if(!items.length) return `<div class="notice-empty"><div class="e-icon">🫧</div><div>아직 공개된 내용이 없어요</div></div>`;
  return `<div class="notice-list">` + items.map(item=>{
    const htmlText = escapeHtml(item).replaceAll('\n','<br>');
    return `<div class="notice-item">
    <label class="cute-checkbox ${which}">
      <input type="checkbox" class="notice-checkbox">
      <span class="box"><svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span>
    </label>
    <span class="notice-item-text">${htmlText}</span>
  </div>`;
  }).join('') + `</div>`;
}
async function renderNoticePanel(which){
  const snap = await db.ref('notices/'+todayStr()).once('value');
  const d = snap.val();
  const published = d && (which==='morning' ? d.morningPublished : d.closingPublished);
  const text = d && (which==='morning' ? d.morning : d.closing);
  const body = document.getElementById('panelBody');
  body.innerHTML = (published && text)
    ? renderNoticeList(text, which)
    : `<div class="notice-empty"><div class="e-icon">🫧</div><div>아직 공개된 내용이 없어요</div></div>`;
}

async function getRosterList(){
  const snap = await db.ref('roster').once('value');
  const val = snap.val() || {};
  return Object.keys(val).map(id=>({id, name:val[id].name})).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
async function renderAttendancePanel(){
  const roster = await getRosterList();
  const attSnap = await db.ref('attendance/'+todayStr()).once('value');
  const att = attSnap.val() || {};
  const box = document.getElementById('panelBody');
  if(!roster.length){ box.innerHTML = '<p style="color:var(--muted);">등록된 학생이 없습니다.</p>'; return; }

  const checked = roster.filter(s=>att[s.id]).sort((a,b)=> (att[a.id].time||'').localeCompare(att[b.id].time||''));
  const unchecked = roster.filter(s=>!att[s.id]);
  const ordered = [...unchecked, ...checked];

  const dashboardPresentOrder = roster
    .filter(s=> att[s.id] && att[s.id].status==='present' && att[s.id].source==='dashboard')
    .sort((a,b)=> (att[a.id].time||'').localeCompare(att[b.id].time||''));
  const rankById = {};
  dashboardPresentOrder.forEach((s,i)=> rankById[s.id] = i+1);

  box.innerHTML = '<div class="att-grid">' + ordered.map(s=>{
    const rec = att[s.id];
    if(rec && rec.status === 'absent'){
      return `<div class="att-cell" data-id="${s.id}" data-name="${escapeHtml(s.name)}">
        <div class="att-name-row">
          <span class="att-name">${escapeHtml(s.name)}</span>
        </div>
        <div class="att-absent-label">결석</div>
      </div>`;
    }
    return `<div class="att-cell" data-id="${s.id}" data-name="${escapeHtml(s.name)}">
      <div class="att-name-row">
        <span class="att-name-group">
          <span class="att-name">${escapeHtml(s.name)}</span>
          ${rankById[s.id] ? `<span class="att-rank">${rankById[s.id]}등</span>` : ''}
        </span>
        ${(rec && rec.status==='out') ? `<span class="att-time">${rec.time}</span>` : ''}
      </div>
      <div class="att-btns">
        <button class="att-pill ${(rec&&rec.status==='present')?'on-present':''}" data-status="present">출석</button>
        <button class="att-pill ${(rec&&rec.status==='out')?'on-out':''}" data-status="out">조퇴</button>
      </div>
    </div>`;
  }).join('') + '</div>';
  box.querySelectorAll('.att-cell').forEach(cell=>{
    const id = cell.dataset.id, name = cell.dataset.name;
    cell.querySelectorAll('.att-pill').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const isActive = btn.classList.contains('on-present') || btn.classList.contains('on-out');
        if(isActive){
          await db.ref(`attendance/${todayStr()}/${id}`).remove();
        } else {
          const status = btn.dataset.status;
          await db.ref(`attendance/${todayStr()}/${id}`).set({ name, status, time: nowHHMM(), source: 'dashboard' });
          await checkAndCelebrateReward(id, name);
        }
        await reconcileAttendancePoint(todayStr(), id);
        await renderAttendancePanel();
        await loadAttendanceWidget();
        checkOverflowFallback();
      });
    });
  });
  await renderLuckyDraw();
  checkOverflowFallback();
}

/* ---------- 오늘의 행운번호 뽑기 (모달 팝업) ----------
   그날 대시보드에서 직접 출석 체크한 학생들을 시간순으로 줄 세워 번호를 매기고,
   그 중 하나를 무작위로 뽑음. 하루 한 번만 뽑히고, 같은 날 다시 눌러도 같은 결과가 나옴.
   관리자 페이지에서 초기화하면 다시 뽑을 수 있음. */
const luckyDrawOverlay = document.getElementById('luckyDrawOverlay');
const luckyDrawEmoji = document.getElementById('luckyDrawEmoji');
const luckyDrawBtn = document.getElementById('luckyDrawBtn');
const luckyDrawResult = document.getElementById('luckyDrawResult');

async function renderLuckyDraw(){
  const snap = await db.ref('luckyDraw/'+todayStr()).once('value');
  const existing = snap.val();
  luckyDrawEmoji.classList.remove('spinning');
  luckyDrawEmoji.textContent = '🍀';
  if(existing){
    luckyDrawBtn.style.display = 'none';
    luckyDrawResult.style.display = 'block';
    luckyDrawResult.innerHTML = `오늘 <b>${existing.number}번째</b>로 출석한 <b>${escapeHtml(existing.studentName)}</b>님`;
  } else {
    luckyDrawBtn.style.display = 'inline-block';
    luckyDrawBtn.disabled = false;
    luckyDrawBtn.textContent = '뽑기';
    luckyDrawResult.style.display = 'none';
  }
}
document.getElementById('luckyDrawIconBtn').addEventListener('click', async ()=>{
  luckyDrawOverlay.classList.add('open');
  await renderLuckyDraw();
});
document.getElementById('luckyDrawCloseBtn').addEventListener('click', ()=> luckyDrawOverlay.classList.remove('open'));
luckyDrawBtn.addEventListener('click', async ()=>{
  const roster = await getRosterList();
  const attSnap = await db.ref('attendance/'+todayStr()).once('value');
  const att = attSnap.val() || {};
  const pool = roster
    .filter(s=> att[s.id] && att[s.id].status==='present' && att[s.id].source==='dashboard')
    .sort((a,b)=> (att[a.id].time||'').localeCompare(att[b.id].time||''));
  if(!pool.length){
    luckyDrawResult.style.display = 'block';
    luckyDrawResult.textContent = '아직 출석한 학생이 없어요';
    return;
  }
  luckyDrawBtn.disabled = true;
  luckyDrawEmoji.classList.add('spinning');
  // 바로 결과가 나오면 심심하니, 살짝 도는 연출을 보여준 뒤 결과를 공개
  await new Promise(res=> setTimeout(res, 1400));
  const number = 1 + Math.floor(Math.random() * pool.length);
  const winner = pool[number-1];
  const payload = { number, studentId: winner.id, studentName: winner.name, drawnAt: Date.now() };
  await db.ref('luckyDraw/'+todayStr()).set(payload);
  await renderLuckyDraw();
});

/* ---------- 시간표 ---------- */
async function loadTimetable(){
  const now = new Date();
  const dowKey = DAY_KEYS[now.getDay()];
  const dateKey = todayStr();
  const overrideSnap = await db.ref('timetableOverride/'+dateKey).once('value');
  const override = overrideSnap.exists() ? overrideSnap.val().periods : null;
  const list = document.getElementById('todayPeriodList');
  if(!WEEK_KEYS.includes(dowKey) && !override){ list.innerHTML='<li class="tt-empty">오늘은 수업이 없는 날이에요.</li>'; return; }
  let periods;
  if(override){ periods = override; }
  else{
    const wSnap = await db.ref('timetableWeekly/'+dowKey).once('value');
    periods = wSnap.exists() ? (wSnap.val().periods || []) : [];
  }
  const filled = periods.map((v,i)=>({idx:i+1,val:v})).filter(p=>p.val && p.val.trim());
  list.innerHTML = filled.length ? filled.map((p,i)=>`<li class="period-chip" style="background:var(--${CHIP_COLORS[i%CHIP_COLORS.length]});"><span class="p-badge">${p.idx}</span><span class="p-subject">${escapeHtml(p.val)}</span></li>`).join('') : '<li class="tt-empty">등록된 시간표가 없습니다.</li>';
}

/* ---------- 퀴즈 (관리자 페이지에서 직접 설정) ---------- */
async function loadQuiz(){
  const qEl = document.getElementById('quizQuestion');
  const cEl = document.getElementById('quizChoices');
  const imgEl = document.getElementById('quizImage');
  const drawBtn = document.getElementById('openDrawBtn');
  try{
    const snap = await db.ref('quiz/'+todayStr()).once('value');
    const data = snap.val();
    if(!data || !data.published || !data.question){
      qEl.textContent = '오늘의 퀴즈가 아직 준비되지 않았어요.';
      cEl.innerHTML = '';
      imgEl.style.display = 'none';
      imgEl.removeAttribute('src');
      drawBtn.style.display = 'none';
      return;
    }
    qEl.textContent = data.question;
    const choices = Array.isArray(data.choices) ? data.choices.filter(c=>c && String(c).trim()) : [];
    cEl.innerHTML = choices.length ? choices.map((c,i)=>`<div class="quiz-choice"><span class="qc-num">${i+1}</span><span>${escapeHtml(String(c))}</span></div>`).join('') : '';
    if(data.imageDataUrl){
      imgEl.src = data.imageDataUrl;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
      imgEl.removeAttribute('src');
    }
    drawBtn.style.display = 'inline-block';
  }catch(e){ console.error(e); qEl.textContent = '퀴즈를 불러오지 못했습니다.'; }
}

function shrinkToFit(el, opts){
  opts = opts || {};
  const max = opts.max || 13.5;
  const min = opts.min || 9;
  let size = max;
  el.style.fontSize = size + 'px';
  let guard = 0;
  while(el.scrollHeight > el.clientHeight && size > min && guard < 20){
    size -= 0.5;
    el.style.fontSize = size + 'px';
    guard++;
  }
}

/* ---------- 오늘의 할 일 ---------- */
function renderTodoLineHtml(l){
  const idx = l.indexOf('/');
  if(idx === -1) return escapeHtml(l);
  const main = escapeHtml(l.slice(0, idx));
  const rest = escapeHtml(l.slice(idx));
  return `${main}<span class="todo-sub">${rest}</span>`;
}
async function loadTodos(){
  const snap = await db.ref('todos/'+todayStr()).once('value');
  const val = snap.val();
  // 이전 버전엔 문자열로만 저장됐어서(공개 개념 없음), 문자열이면 항상 공개였던 걸로 취급
  const data = (val === null || val === undefined) ? { text:'', published:true }
    : (typeof val === 'string') ? { text: val, published:true }
    : { text: val.text || '', published: val.published !== false };
  const box = document.getElementById('todoSection');
  if(!data.published){
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  const lines = data.text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  box.classList.add('show');
  box.innerHTML = '<div class="todo-title headfont">📝 오늘의 할 일</div><div class="todo-list">' +
    lines.map(l=>`<div class="todo-row">
      <label class="cute-checkbox todo">
        <input type="checkbox" class="todo-check">
        <span class="box"><svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span>
      </label>
      <span class="todo-text">${renderTodoLineHtml(l)}</span>
    </div>`).join('') + '</div>';
}

/* ---------- 출석률 위젯 & 축하 효과음 ----------
   합성음 대신 외부 mp3 파일(팡파레 + 환호성)을 함께 재생.
   sounds/celebration-fanfare.mp3, sounds/celebration-crowd.mp3 파일을
   이 HTML과 같은 경로 기준 sounds 폴더에 넣어두면 됨. */
function playCelebrationSound(){
  try{
    const fanfare = new Audio('sounds/celebration-fanfare.mp3');
    const crowd = new Audio('sounds/celebration-crowd.mp3');
    fanfare.volume = 0.55;
    crowd.volume = 0.75;
    fanfare.play().catch(e=> console.error('celebration sound error', e));
    // 팡파레가 살짝 먼저 터지고 환호성이 겹쳐 들어오도록 약간의 딜레이를 둠
    setTimeout(()=>{
      crowd.play().catch(e=> console.error('celebration sound error', e));
    }, 250);
  }catch(e){ console.error('celebration sound error', e); }
}

let attFullNow = false;
let attClapAllowed = false;
async function loadAttendanceWidget(){
  const widget = document.getElementById('attendanceWidget');
  const roster = await getRosterList();
  if(!roster.length){ widget.style.display = 'none'; attFullNow = false; return; }
  const [attSnap, clapSnap] = await Promise.all([
    db.ref('attendance/'+todayStr()).once('value'),
    db.ref('clapAllowed/'+todayStr()).once('value')
  ]);
  const att = attSnap.val() || {};
  attClapAllowed = !!clapSnap.val();
  let present = 0, checkedTotal = 0;
  const uncheckedNames = [];
  roster.forEach(s=>{
    const rec = att[s.id];
    if(rec){ checkedTotal++; if(rec.status === 'present') present++; }
    else uncheckedNames.push(s.name);
  });
  const unchecked = uncheckedNames.length;
  const rate = Math.round((present / roster.length) * 100);
  widget.style.display = 'block';
  document.getElementById('attRatePercent').textContent = rate + '%';
  document.getElementById('attRateBarFill').style.width = rate + '%';
  const uncheckedEl = document.getElementById('attRateUnchecked');
  if(unchecked > 0){
    uncheckedEl.textContent = unchecked <= 5
      ? `아직 출석하지 않은 학생: ${unchecked}명 (${uncheckedNames.join(', ')})`
      : `아직 출석하지 않은 학생: ${unchecked}명`;
  } else {
    uncheckedEl.textContent = '';
  }
  attFullNow = (rate === 100);
  widget.classList.toggle('full', attFullNow);
  widget.classList.toggle('clap-ready', attFullNow && attClapAllowed);
}
document.getElementById('attRateBarTrack').addEventListener('click', ()=>{
  if(!attFullNow || !attClapAllowed) return;
  playCelebrationSound();
});

/* ---------- 급식 (NEIS) ----------
   전자칠판 등 일부 기기는 open.neis.go.kr 도메인을 방화벽이 막아서
   직접 호출하면 계속 "불러오는 중"에 멈추는 문제가 있었음.
   그래서 관리자(admin.html의 "조회·종례" 탭 > 급식 미리 저장)가 미리
   NEIS에서 받아와 Firebase의 mealCache/{YYYYMMDD}에 저장해두고,
   여기서는 그 캐시만 읽는다. (전자칠판 자체는 NEIS에 접속할 필요가 없어짐)
   캐시에 값이 없는 날짜(관리자가 아직 저장하지 않은 날짜)만 예외적으로
   기기에서 직접 NEIS를 호출해보는 폴백을 둔다. */
let mealDate = new Date();
async function loadMeal(){
  const bodyEl = document.getElementById('mealBody');
  document.getElementById('mealDateLabel').textContent = `${mealDate.getMonth()+1}월 ${mealDate.getDate()}일`;
  const dateCompact = todayStrCompact(mealDate);
  bodyEl.innerHTML = '<div class="meal-loading">불러오는 중...</div>';

  try{
    const cacheSnap = await db.ref('mealCache/'+dateCompact).once('value');
    const cached = cacheSnap.val();
    if(cached && cached.items && cached.items.length){
      renderMealItems(bodyEl, cached.items);
      return;
    }
    if(cached && cached.empty){
      bodyEl.innerHTML = '<div class="meal-empty">🍽️ 이 날은<br>급식 정보가 없어요.</div>';
      return;
    }
  }catch(e){
    console.error('mealCache read error', e);
  }

  // 캐시에 아직 없는 날짜 → 폴백으로 NEIS 직접 호출 시도 (방화벽 기기에서는 실패할 수 있음)
  const cfgSnap = await db.ref('config/neis').once('value');
  const cfg = cfgSnap.val();
  if(!cfg || !cfg.officeCode || !cfg.schoolCode){
    bodyEl.innerHTML = '<div class="meal-empty">🫧 관리자 페이지에서<br>학교를 등록해주세요.</div>';
    return;
  }
  try{
    const keyParam = cfg.apiKey ? `&KEY=${encodeURIComponent(cfg.apiKey)}` : '';
    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json${keyParam}&ATPT_OFCDC_SC_CODE=${cfg.officeCode}&SD_SCHUL_CODE=${cfg.schoolCode}&MLSV_YMD=${dateCompact}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(()=> controller.abort(), 8000);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    const json = await res.json();
    const rows = json && json.mealServiceDietInfo && json.mealServiceDietInfo[1] && json.mealServiceDietInfo[1].row;
    if(!rows || !rows.length){ bodyEl.innerHTML = '<div class="meal-empty">🍽️ 이 날은<br>급식 정보가 없어요.</div>'; return; }
    const items = rows[0].DDISH_NM.split('<br/>').map(s=>s.replace(/\([0-9.]+\)/g,'').trim()).filter(Boolean);
    renderMealItems(bodyEl, items);
  }catch(e){
    const timedOut = e && e.name === 'AbortError';
    bodyEl.innerHTML = timedOut
      ? '<div class="meal-empty">⚠️ 응답이 없어요.<br>이 기기의 인터넷/방화벽을<br>확인해주세요.</div>'
      : '<div class="meal-empty">⚠️ 급식 정보를<br>가져오지 못했어요.</div>';
  }
}
function renderMealItems(bodyEl, items){
  bodyEl.innerHTML = '<ul class="meal-list">' + items.map(i=>`<li>${escapeHtml(i)}</li>`).join('') + '</ul>';
  shrinkToFit(bodyEl, {max:13.5, min:9});
}
document.getElementById('mealPrevBtn').addEventListener('click', ()=>{ mealDate = new Date(mealDate.getFullYear(), mealDate.getMonth(), mealDate.getDate()-1); loadMeal(); });
document.getElementById('mealNextBtn').addEventListener('click', ()=>{ mealDate = new Date(mealDate.getFullYear(), mealDate.getMonth(), mealDate.getDate()+1); loadMeal(); });
document.getElementById('mealTodayBtn').addEventListener('click', ()=>{ mealDate = new Date(); loadMeal(); });

/* ---------- D-Day ---------- */
async function loadDday(){
  const snap = await db.ref('config/dday').once('value');
  const cfg = snap.val();
  const el = document.getElementById('ddayWidget');
  if(!cfg || !cfg.date || !cfg.label){ el.style.display = 'none'; return; }
  const target = new Date(cfg.date+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((target - now) / 86400000);
  let text;
  if(diffDays > 0) text = `${cfg.label} D-${diffDays}`;
  else if(diffDays === 0) text = `${cfg.label} D-DAY`;
  else text = `${cfg.label} D+${Math.abs(diffDays)}`;
  el.textContent = '🤍 ' + text;
  el.style.display = 'inline-block';
}

/* ---------- 그려서 답안 제출 (작은 하단 패널, 배경 안 가림) ---------- */
const drawOverlay = document.getElementById('drawOverlay');
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');
let selectedStudent = null;
let drawing = false;

function resetCanvas(){
  drawCtx.fillStyle = '#ffffff';
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.lineWidth = 4;
  drawCtx.strokeStyle = '#4a4458';
}
function getPos(e){
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
drawCanvas.addEventListener('pointerdown', (e)=>{
  drawing = true;
  drawCanvas.setPointerCapture(e.pointerId);
  const p = getPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(p.x, p.y);
});
drawCanvas.addEventListener('pointermove', (e)=>{
  if(!drawing) return;
  const p = getPos(e);
  drawCtx.lineTo(p.x, p.y);
  drawCtx.stroke();
});
function stopDrawing(){ drawing = false; }
drawCanvas.addEventListener('pointerup', stopDrawing);
drawCanvas.addEventListener('pointerleave', stopDrawing);

async function openDrawOverlay(){
  const roster = await getRosterList();
  const answeredSnap = await db.ref('quizAnswers/'+todayStr()).once('value');
  const answered = answeredSnap.val() || {};
  const pointsSnap = await db.ref('points').once('value');
  const pointsVal = pointsSnap.val() || {};
  const grid = document.getElementById('drawNameGrid');
  grid.innerHTML = roster.length ? roster.map(s=>{
    const done = !!answered[s.id];
    const hearts = pointsToHearts(pointsVal[s.id]);
    const heartsHtml = hearts ? `<span class="pill-hearts">${hearts}</span>` : '';
    return done
      ? `<button class="name-pill done" disabled>${escapeHtml(s.name)}${heartsHtml}</button>`
      : `<button class="name-pill" data-id="${s.id}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}${heartsHtml}</button>`;
  }).join('') : '<p style="color:var(--muted); font-size:13px;">등록된 학생이 없습니다.</p>';
  grid.querySelectorAll('.name-pill:not(.done)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedStudent = { id: btn.dataset.id, name: btn.dataset.name };
      document.getElementById('drawingForLabel').textContent = `✏️ ${selectedStudent.name}님`;
      document.getElementById('drawStepName').style.display = 'none';
      document.getElementById('drawStepCanvas').style.display = 'block';
      document.querySelector('.draw-box').classList.remove('wide');
      resetCanvas();
    });
  });
  document.getElementById('drawStepName').style.display = 'block';
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepDone').style.display = 'none';
  document.querySelector('.draw-box').classList.add('wide');
  drawOverlay.classList.add('open');
}
document.getElementById('openDrawBtn').addEventListener('click', openDrawOverlay);
document.getElementById('closeDrawOverlay').addEventListener('click', ()=> drawOverlay.classList.remove('open'));
document.getElementById('backToNameBtn').addEventListener('click', ()=>{
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepName').style.display = 'block';
  document.querySelector('.draw-box').classList.add('wide');
});
document.getElementById('clearCanvasBtn').addEventListener('click', resetCanvas);
document.getElementById('submitDrawingBtn').addEventListener('click', async ()=>{
  if(!selectedStudent) return;
  const dataUrl = drawCanvas.toDataURL('image/jpeg', 0.82);
  await db.ref(`quizAnswers/${todayStr()}/${selectedStudent.id}`).set({
    name: selectedStudent.name, dataUrl, submittedAt: Date.now()
  });
  await checkAndCelebrateReward(selectedStudent.id, selectedStudent.name);
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepDone').style.display = 'block';
  setTimeout(()=>{ drawOverlay.classList.remove('open'); }, 1300);
});

async function loadAll(){
  await Promise.all([loadTimetable(), loadQuiz(), loadDday(), loadMeal(), loadTodos(), loadAttendanceWidget()]);
  if(openPanelType === 'attendance') await renderAttendancePanel();
  else if(openPanelType === 'morning' || openPanelType === 'closing') await renderNoticePanel(openPanelType);
  checkOverflowFallback();
}

/* ---------- 관리자 페이지 변경 사항을 실시간으로 반영 ---------- */
function attachRealtimeListeners(){
  const dowKey = DAY_KEYS[new Date().getDay()];
  db.ref('config/dday').on('value', ()=> loadDday());
  db.ref('todos/'+todayStr()).on('value', ()=> loadTodos());
  db.ref('roster').on('value', async ()=>{
    await loadAttendanceWidget();
    if(openPanelType === 'attendance') await renderAttendancePanel();
  });
  db.ref('attendance/'+todayStr()).on('value', async ()=>{
    await loadAttendanceWidget();
    if(openPanelType === 'attendance') await renderAttendancePanel();
  });
  db.ref('clapAllowed/'+todayStr()).on('value', ()=> loadAttendanceWidget());
  db.ref('quiz/'+todayStr()).on('value', ()=> loadQuiz());
  db.ref('notices/'+todayStr()).on('value', async ()=>{
    if(openPanelType === 'morning' || openPanelType === 'closing') await renderNoticePanel(openPanelType);
  });
  db.ref('timetableWeekly/'+dowKey).on('value', ()=> loadTimetable());
  db.ref('timetableOverride/'+todayStr()).on('value', ()=> loadTimetable());
  // 관리자가 "급식 미리 저장"으로 오늘자 mealCache를 갱신하면 화면을 새로고침 안 해도 바로 반영되도록 함
  db.ref('mealCache/'+todayStrCompact(new Date())).on('value', ()=> loadMeal());
}

if(initFirebase()){
  loadAll();
  attachRealtimeListeners();
  setInterval(()=>{ loadMeal(); loadQuiz(); }, 5*60*1000);
}
// PWA 오프라인 캐싱(서비스워커)을 완전히 그만 쓰기로 함 - 기기마다 옛날 버전이 남아있는
// 문제가 반복돼서, 캐싱의 이점보다 부작용이 커 껐음. 이미 등록되어 있던 기기는
// 아래 코드가 자동으로 해제하고 캐시도 지워서 스스로 정리됨(사용자가 수동으로 안 지워도 됨).
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=> reg.unregister());
  }).catch(()=>{});
}
if(window.caches){
  caches.keys().then(keys=> keys.forEach(k=> caches.delete(k))).catch(()=>{});
}
</script>
