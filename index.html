<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 대시보드</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f78fb3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="학급대시보드">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase.js"></script>

<style>
  :root{
    --bg1:#fdf3f6; --bg2:#eef1fd; --bg3:#fbf6e9;
    --card:#ffffff;
    --pink:#ffd3e0; --pink-deep:#f78fb3;
    --mint:#c8f0e2; --mint-deep:#4fbe9c;
    --lav:#e2dcfb; --lav-deep:#9b7fea;
    --yellow:#fff0bf; --yellow-deep:#f0b93a;
    --sky:#d3ecfb; --sky-deep:#5aa9dd;
    --text:#4a4458; --muted:#a79fc0; --line:#f2ebf7;
    --shadow: 0 10px 28px rgba(160,140,190,0.16);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0;padding:0;height:100%; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--text); overflow:hidden; }
  body{
    background: radial-gradient(circle at 8% 12%, var(--pink) 0%, transparent 32%),
                radial-gradient(circle at 92% 15%, var(--sky) 0%, transparent 34%),
                radial-gradient(circle at 15% 90%, var(--yellow) 0%, transparent 30%),
                radial-gradient(circle at 88% 88%, var(--lav) 0%, transparent 34%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment: fixed;
  }
  #app{ height:100vh; padding:22px; display:flex; }
  #board{ flex:1; display:flex; flex-direction:column; gap:18px; min-height:0; }

  .headfont{ font-family:'Jua',sans-serif; font-weight:400; }
  .icon-svg{ display:inline-flex; vertical-align:-0.15em; }
  .icon-svg svg{ display:block; }
  .label{ font-size:19px; color:var(--text); display:flex; align-items:center; gap:8px; margin-bottom:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card{
    position:relative; background:var(--card); border-radius:26px; padding:20px 22px;
    display:flex; flex-direction:column; min-height:0; box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,0.6);
  }

  #mainRow{ flex:1; display:flex; gap:18px; min-height:0; }

  #sidePanel{ width:0; padding:0; overflow:hidden; flex-shrink:0; transition:width .32s cubic-bezier(.4,0,.2,1); background:var(--card); }
  #sidePanel.open{ width:440px; padding:22px 24px; }
  #sidePanelInner{ width:392px; height:100%; display:flex; flex-direction:column; min-height:0; }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-shrink:0; }
  .panel-header h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:22px; margin:0; color:var(--pink-deep); }
  .panel-close{ background:var(--line); border:none; width:32px; height:32px; border-radius:50%; color:var(--text); font-size:15px; cursor:pointer; flex-shrink:0; }
  #panelBody{ flex:1; overflow-y:auto; min-height:0; }

  /* 조회/종례 - 체크박스형 항목 */
  .notice-list{ display:flex; flex-direction:column; gap:10px; }
  .notice-item{ display:flex; align-items:flex-start; gap:12px; background:var(--line); padding:14px 16px; border-radius:16px; }
  .cute-checkbox{ position:relative; display:inline-flex; flex-shrink:0; margin-top:1px; cursor:pointer; width:24px; height:24px; }
  .cute-checkbox input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .cute-checkbox .box{ width:24px; height:24px; border-radius:9px; background:#fff; border:2.5px solid var(--line); display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s, transform .1s; box-shadow:0 2px 4px rgba(160,140,190,0.15); }
  .cute-checkbox input:active ~ .box{ transform:scale(0.9); }
  .cute-checkbox .check-icon{ width:14px; height:14px; opacity:0; transform:scale(0.4); transition:opacity .15s, transform .15s; }
  .cute-checkbox input:checked ~ .box .check-icon{ opacity:1; transform:scale(1); }
  .cute-checkbox.morning .box{ border-color:var(--yellow-deep); }
  .cute-checkbox.morning input:checked ~ .box{ background:var(--yellow-deep); }
  .cute-checkbox.closing .box{ border-color:var(--pink-deep); }
  .cute-checkbox.closing input:checked ~ .box{ background:var(--pink-deep); }
  .notice-item-text{ font-size:17px; font-weight:600; line-height:1.55; }
  .notice-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:50px 10px; color:var(--muted); font-weight:600; text-align:center; }
  .notice-empty .e-icon{ font-size:40px; }

  .att-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .att-cell{ background:var(--line); border-radius:16px; padding:12px 12px; display:flex; flex-direction:column; gap:8px; }
  .att-cell .att-name-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .att-cell .att-name{ font-size:15px; font-weight:800; }
  .att-cell .att-time{ font-size:11.5px; font-weight:700; color:var(--mint-deep); }
  .att-cell .att-btns{ display:flex; gap:6px; }
  .att-absent-label{ color:#e0556f; font-weight:800; font-size:14px; text-align:center; padding:4px 0; }
  .att-pill{ flex:1; border:none; background:#fff; color:var(--text); padding:8px 6px; border-radius:14px; font-size:13px; font-weight:700; cursor:pointer; }
  .att-pill.on-present{ background:var(--mint-deep); color:#fff; }
  .att-pill.on-out{ background:var(--sky-deep); color:#fff; }

  #clockCard{ flex:0 0 clamp(540px, 52vw, 680px); align-items:center; text-align:center; justify-content:center; background:linear-gradient(155deg, #fff, var(--pink) 180%); }
  #timetableCard{ flex:0 0 260px; min-width:0; background:linear-gradient(160deg, #fff, var(--sky) 220%); }
  #todayPeriodList{ list-style:none; margin:0; padding:0; flex:1.7; overflow:hidden; display:flex; flex-direction:column; gap:6px; min-width:0; min-height:0; }
  .tt-divider{ height:1px; background:rgba(90,169,221,0.25); margin:10px 0; flex-shrink:0; }
  .meal-section{ flex:0.6; display:flex; flex-direction:column; min-height:0; }
  .meal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-shrink:0; }
  .meal-label{ font-size:16px; color:var(--text); }
  .meal-nav{ display:flex; gap:4px; }
  .meal-nav button{ border:none; background:rgba(255,255,255,0.7); color:var(--sky-deep); width:24px; height:24px; border-radius:8px; font-size:13px; font-weight:800; cursor:pointer; }
  .meal-nav button#mealTodayBtn{ width:auto; padding:0 8px; font-size:11px; }
  #mealDateLabel{ font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; flex-shrink:0; }
  #mealBody{ flex:1; overflow:hidden; min-height:0; }
  .meal-list{ list-style:none; margin:0; padding:0; font-size:13.5px; font-weight:600; line-height:1.6; }
  .meal-empty, .meal-loading{ color:var(--muted); font-size:13px; font-weight:600; text-align:center; padding:14px 4px; }
  #quizCard{ flex:1; min-width:0; background:linear-gradient(160deg, #fff, var(--lav) 230%); position:relative; overflow:hidden; }

  #clockTime{ font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(52px, 6vw, 108px); line-height:1; color:var(--text); font-variant-numeric:tabular-nums; }
  #clockDate{ font-size:21px; font-weight:700; color:var(--pink-deep); margin-top:10px; }
  #clockDday{ font-size:14px; font-weight:600; color:var(--muted); margin-top:6px; }
  #ddayWidget{ font-family:'Jua',sans-serif; font-size:15px; color:#7a5ea8; margin-top:14px; background:var(--lav); padding:8px 18px; border-radius:20px; display:none; }

  #quickBtnRow{ display:flex; gap:10px; margin-top:22px; }
  #todoSection{ width:100%; max-width:360px; margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .todo-row{ display:flex; align-items:center; gap:10px; }
  .todo-check{ width:18px; height:18px; min-width:18px; border-radius:6px; border:2px solid var(--lav-deep); background:#fff; cursor:pointer; }
  .todo-check:checked{ background:var(--lav-deep); }
  .todo-text{ flex:1; border-bottom:2px solid rgba(90,110,130,0.2); padding-bottom:4px; font-size:15px; font-weight:600; color:var(--text); text-align:left; min-height:1.4em; }
  .quick-btn{
    cursor:pointer; border:none; color:var(--text); padding:12px 16px; border-radius:20px;
    font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px;
    transition:transform .12s, filter .15s, box-shadow .15s; box-shadow:0 4px 10px rgba(160,140,190,0.16);
  }
  .quick-btn:hover{ filter:brightness(1.04); transform:translateY(-2px); }
  .quick-btn:active{ transform:scale(0.97); }
  .quick-btn.active{ box-shadow:0 0 0 3px rgba(255,255,255,0.9), 0 4px 12px rgba(160,140,190,0.3); transform:translateY(-1px); }
  #attendTile{ background:var(--mint); }
  #morningTile{ background:var(--yellow); }
  #closingTile{ background:var(--pink); }

  #todayPeriodList{ list-style:none; margin:0; padding:0; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .period-chip{ flex:1; min-height:0; border-radius:14px; padding:4px 12px; display:flex; align-items:center; justify-content:center; gap:9px; font-weight:700; font-size:16px; min-width:0; overflow:hidden; }
  .p-badge{ width:24px; height:24px; min-width:24px; border-radius:50%; background:rgba(255,255,255,0.75); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; font-family:'Jua',sans-serif; color:var(--text); flex-shrink:0; }
  .p-subject{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .tt-empty{ color:var(--muted); font-weight:600; font-size:13px; text-align:center; }

  #quizCard::before{ content:"?"; position:absolute; font-family:'Jua',sans-serif; font-size:220px; color:rgba(155,127,234,0.09); right:-30px; bottom:-56px; line-height:1; pointer-events:none; user-select:none; }
  .quiz-inner{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:6px 10px; }
  .quiz-icon{ transition: font-size .32s ease; }
  .quiz-question, .quiz-choices, .quiz-raw{ transition: opacity .25s ease, max-height .32s ease, margin .32s ease; max-height:600px; opacity:1; overflow:hidden; }
  .quiz-submit-btn{ transition: font-size .3s ease, padding .3s ease, transform .12s ease, filter .15s ease; }
  #quizCard.squished{ cursor:pointer; }
  #quizCard.squished .quiz-question,
  #quizCard.squished .quiz-choices,
  #quizCard.squished .quiz-raw{ opacity:0; max-height:0; margin:0; }
  #quizCard.squished::before{ display:none; }
  #quizCard.squished .quiz-icon{ font-size:22px; }
  #quizCard.squished .quiz-submit-btn{ font-size:12px; padding:8px 12px; white-space:normal; }
  .quiz-icon{ font-size:30px; }
  .quiz-question{ font-size:clamp(22px, 2.8vw, 34px); font-weight:800; line-height:1.4; max-height:100%; overflow-y:auto; }
  .quiz-choices{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .quiz-choice{ background:rgba(255,255,255,0.8); border-radius:14px; padding:9px 16px; font-size:15px; font-weight:700; }
  .quiz-raw{ font-size:11px; font-family:monospace; white-space:pre-wrap; opacity:.6; max-height:100px; overflow-y:auto; }
  .quiz-submit-btn{ position:relative; margin-top:4px; border:none; background:var(--lav-deep); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 10px rgba(155,127,234,0.3); }
  .quiz-submit-btn:hover{ filter:brightness(1.06); }

  #configErrorBanner{ position:fixed; top:0; left:0; right:0; background:#e0556f; color:#fff; padding:16px 22px; font-size:15px; font-weight:700; z-index:999; display:none; }

  /* 그리기 답안 제출 - 화면 하단 중앙에 작게, 배경 안 가림 */
  #drawOverlay{ position:fixed; left:50%; bottom:26px; z-index:200; opacity:0; visibility:hidden; transform:translateX(-50%) translateY(14px); transition:opacity .22s ease, transform .22s ease, visibility 0s linear .22s; }
  #drawOverlay.open{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); transition:opacity .22s ease, transform .22s ease, visibility 0s; }
  .draw-box{ width:220px; background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 12px 32px rgba(74,68,88,0.28); position:relative; border:1px solid rgba(255,255,255,0.6); }
  .draw-box h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:13px; color:var(--lav-deep); margin:0 0 8px; text-align:center; }
  .close-x{ position:absolute; top:6px; right:6px; background:var(--line); border:none; width:20px; height:20px; border-radius:50%; color:var(--text); font-size:10px; cursor:pointer; }
  .name-grid{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-height:150px; overflow-y:auto; }
  .name-pill{ border:none; background:var(--lav); color:var(--text); padding:6px 10px; border-radius:12px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .name-pill:hover{ background:var(--lav-deep); color:#fff; }
  .name-pill.done{ background:var(--line); color:var(--muted); cursor:default; opacity:.55; }
  .name-pill.done:hover{ background:var(--line); color:var(--muted); }
  #drawCanvas{ width:100%; height:70px; border-radius:10px; background:#fff; border:2px solid var(--line); touch-action:none; display:block; }
  .draw-actions{ display:flex; align-items:center; gap:5px; margin-top:8px; }
  .draw-btn{ border:none; background:var(--line); color:var(--text); padding:7px 10px; border-radius:10px; font-size:11px; font-weight:700; cursor:pointer; }
  .draw-btn.primary{ background:var(--lav-deep); color:#fff; flex:1; padding:8px 10px; font-size:12px; }
  .draw-done{ text-align:center; font-size:14px; font-weight:800; padding:10px 0; font-family:'Jua',sans-serif; color:var(--mint-deep); }

  /* 모바일/좁은 화면: 가로 배치 대신 세로 스크롤 */
  @media (max-width: 820px){
    html,body{ overflow:auto; height:auto; }
    #app{ height:auto; min-height:100vh; padding:14px; }
    #board{ gap:14px; }
    #mainRow{ flex-direction:column; height:auto; }
    #sidePanel{ width:100% !important; max-height:0; padding:0; transition:max-height .3s ease; }
    #sidePanel.open{ max-height:1000px; padding:20px; }
    #sidePanelInner{ width:100%; height:auto; }
    #clockCard{ flex:none; width:100%; min-height:280px; }
    #timetableCard{ flex:none; width:100%; min-height:320px; }
    #quizCard{ flex:none; width:100%; min-height:260px; }
    #quizCard.squished .quiz-inner{ display:flex !important; }
    #quizCard.squished .quiz-minimal-label{ display:none !important; }
    #clockTime{ font-size:clamp(48px, 14vw, 80px); }
  }
</style>
</head>
<body>
<div id="configErrorBanner"></div>
<div id="app"><div id="board">
  <div id="mainRow">
    <div class="card" id="timetableCard">
      <div class="label headfont">📚 시간표</div>
      <ul id="todayPeriodList"></ul>
      <div class="tt-divider"></div>
      <div class="meal-section">
        <div class="meal-header">
          <span class="meal-label headfont">🍱 급식</span>
          <div class="meal-nav">
            <button id="mealPrevBtn">‹</button>
            <button id="mealTodayBtn">오늘</button>
            <button id="mealNextBtn">›</button>
          </div>
        </div>
        <div id="mealDateLabel"></div>
        <div id="mealBody">불러오는 중...</div>
      </div>
    </div>

    <div class="card" id="sidePanel">
      <div id="sidePanelInner">
        <div class="panel-header">
          <h2 id="panelTitle"></h2>
          <button class="panel-close" id="panelCloseBtn">✕</button>
        </div>
        <div id="panelBody"></div>
      </div>
    </div>

    <div class="card" id="clockCard">
      <div id="clockTime">--:--:--</div>
      <div id="clockDate">-</div>
      <div id="clockDday"></div>
      <div id="ddayWidget"></div>
      <div id="quickBtnRow">
        <div class="quick-btn" id="attendTile">🙋 출결</div>
        <div class="quick-btn" id="morningTile">📣 조회</div>
        <div class="quick-btn" id="closingTile">🌇 종례</div>
      </div>
      <div id="todoSection"></div>
    </div>

    <div class="card" id="quizCard">
      <div class="quiz-inner">
        <div class="quiz-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor"><path d="M12 2.5c.5 3.2 1.3 5.3 2.5 6.5s3.3 2 6.5 2.5c-3.2.5-5.3 1.3-6.5 2.5s-2 3.3-2.5 6.5c-.5-3.2-1.3-5.3-2.5-6.5S6.2 12 3 11.5c3.2-.5 5.3-1.3 6.5-2.5S11.5 5.7 12 2.5z"/></svg></div>
        <div class="quiz-question" id="quizQuestion">불러오는 중...</div>
        <div class="quiz-choices" id="quizChoices"></div>
        <button class="quiz-submit-btn" id="openDrawBtn" style="display:none;">✏️ 그려서 답안 제출</button>
        <div class="quiz-raw" id="quizRaw"></div>
      </div>
    </div>
  </div>
</div></div>

<div id="drawOverlay">
  <div class="draw-box">
    <button class="close-x" id="closeDrawOverlay">✕</button>

    <div id="drawStepName">
      <h2>✏️ 누가 그릴까요?</h2>
      <div class="name-grid" id="drawNameGrid"></div>
    </div>

    <div id="drawStepCanvas" style="display:none;">
      <h2 id="drawingForLabel"></h2>
      <canvas id="drawCanvas" width="520" height="220"></canvas>
      <div class="draw-actions">
        <button class="draw-btn" id="backToNameBtn">‹ 다른사람</button>
        <button class="draw-btn primary" id="submitDrawingBtn">제출</button>
        <button class="draw-btn" id="clearCanvasBtn">지우기</button>
      </div>
    </div>

    <div id="drawStepDone" style="display:none;">
      <div class="draw-done">🎉 제출 완료!</div>
    </div>
  </div>
</div>

<script>
const DAYS_KR = ['일','월','화','수','목','금','토'];
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEK_KEYS = ['mon','tue','wed','thu','fri'];
const CHIP_COLORS = ['pink','mint','yellow','lav','sky'];
function todayStr(d=new Date()){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStrCompact(d=new Date()){ return todayStr(d).replaceAll('-',''); }
function nowHHMM(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let db, quizDb;

function initFirebase(){
  const banner = document.getElementById('configErrorBanner');
  if(typeof DASHBOARD_FIREBASE_CONFIG === 'undefined' || !DASHBOARD_FIREBASE_CONFIG.apiKey){
    banner.textContent = '⚠️ firebase.js를 찾지 못했거나 설정값이 비어있어요. index.html과 같은 폴더에 firebase.js가 올라가 있는지 확인해주세요.';
    banner.style.display = 'block';
    return false;
  }
  if(!db){
    const dashboardApp = firebase.initializeApp(DASHBOARD_FIREBASE_CONFIG, 'dashboard');
    db = dashboardApp.database();
    if(QUIZ_FIREBASE_CONFIG.apiKey){
      const quizApp = firebase.initializeApp(QUIZ_FIREBASE_CONFIG, 'quiz');
      quizDb = quizApp.database();
    }
  }
  return true;
}

function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent = [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  document.getElementById('clockDate').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS_KR[now.getDay()]})`;
  const hour = now.getHours();
  document.getElementById('clockDday').textContent = hour<12 ? '좋은 아침이에요 ☀️' : (hour<16 ? '오늘도 힘차게 📖' : '수고 많았어요 🌙');
}
setInterval(tickClock,1000); tickClock();

/* ---------- 사이드 패널 ---------- */
const sidePanel = document.getElementById('sidePanel');
const quizCardEl = document.getElementById('quizCard');
let openPanelType = null;

function closePanel(){
  sidePanel.classList.remove('open');
  quizCardEl.classList.remove('squished');
  openPanelType = null;
  document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active'));
}
document.getElementById('panelCloseBtn').addEventListener('click', closePanel);
quizCardEl.addEventListener('click', (e)=>{
  if(!quizCardEl.classList.contains('squished')) return;
  if(e.target.closest('#openDrawBtn')) return;
  closePanel();
});

async function openPanel(type){
  if(openPanelType === type){ closePanel(); return; }
  openPanelType = type;
  document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(type==='attendance' ? 'attendTile' : (type==='morning' ? 'morningTile' : 'closingTile')).classList.add('active');
  sidePanel.classList.add('open');
  quizCardEl.classList.add('squished');

  if(type==='attendance'){
    document.getElementById('panelTitle').textContent = '🙋 출결 체크';
    await renderAttendancePanel();
  } else if(type==='morning'){
    document.getElementById('panelTitle').textContent = '📣 조회사항';
    await renderNoticePanel('morning');
  } else {
    document.getElementById('panelTitle').textContent = '🌇 종례사항';
    await renderNoticePanel('closing');
  }
}
document.getElementById('attendTile').addEventListener('click', ()=> openPanel('attendance'));
document.getElementById('morningTile').addEventListener('click', ()=> openPanel('morning'));
document.getElementById('closingTile').addEventListener('click', ()=> openPanel('closing'));

function renderNoticeList(text, which){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<div class="notice-empty"><div class="e-icon">🌤️</div><div>아직 공개된 내용이 없어요</div></div>`;
  return `<div class="notice-list">` + lines.map(l=>`<div class="notice-item">
    <label class="cute-checkbox ${which}">
      <input type="checkbox" class="notice-checkbox">
      <span class="box"><svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg></span>
    </label>
    <span class="notice-item-text">${escapeHtml(l)}</span>
  </div>`).join('') + `</div>`;
}
async function renderNoticePanel(which){
  const snap = await db.ref('notices/'+todayStr()).once('value');
  const d = snap.val();
  const published = d && (which==='morning' ? d.morningPublished : d.closingPublished);
  const text = d && (which==='morning' ? d.morning : d.closing);
  const body = document.getElementById('panelBody');
  body.innerHTML = (published && text)
    ? renderNoticeList(text, which)
    : `<div class="notice-empty"><div class="e-icon">🌤️</div><div>아직 공개된 내용이 없어요</div></div>`;
}

async function getRosterList(){
  const snap = await db.ref('roster').once('value');
  const val = snap.val() || {};
  return Object.keys(val).map(id=>({id, name:val[id].name})).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
async function renderAttendancePanel(){
  const roster = await getRosterList();
  const attSnap = await db.ref('attendance/'+todayStr()).once('value');
  const att = attSnap.val() || {};
  const box = document.getElementById('panelBody');
  if(!roster.length){ box.innerHTML = '<p style="color:var(--muted);">등록된 학생이 없습니다.</p>'; return; }

  const checked = roster.filter(s=>att[s.id]).sort((a,b)=> (att[a.id].time||'').localeCompare(att[b.id].time||''));
  const unchecked = roster.filter(s=>!att[s.id]);
  const ordered = [...checked, ...unchecked];

  box.innerHTML = '<div class="att-grid">' + ordered.map(s=>{
    const rec = att[s.id];
    if(rec && rec.status === 'absent'){
      return `<div class="att-cell" data-id="${s.id}" data-name="${escapeHtml(s.name)}">
        <div class="att-name-row">
          <span class="att-name">${escapeHtml(s.name)}</span>
        </div>
        <div class="att-absent-label">결석</div>
      </div>`;
    }
    return `<div class="att-cell" data-id="${s.id}" data-name="${escapeHtml(s.name)}">
      <div class="att-name-row">
        <span class="att-name">${escapeHtml(s.name)}</span>
        ${rec ? `<span class="att-time">${rec.time}</span>` : ''}
      </div>
      <div class="att-btns">
        <button class="att-pill ${(rec&&rec.status==='present')?'on-present':''}" data-status="present">출석</button>
        <button class="att-pill ${(rec&&rec.status==='out')?'on-out':''}" data-status="out">조퇴</button>
      </div>
    </div>`;
  }).join('') + '</div>';
  box.querySelectorAll('.att-cell').forEach(cell=>{
    const id = cell.dataset.id, name = cell.dataset.name;
    cell.querySelectorAll('.att-pill').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const isActive = btn.classList.contains('on-present') || btn.classList.contains('on-out');
        if(isActive){
          await db.ref(`attendance/${todayStr()}/${id}`).remove();
        } else {
          await db.ref(`attendance/${todayStr()}/${id}`).set({ name, status: btn.dataset.status, time: nowHHMM() });
        }
        await renderAttendancePanel();
      });
    });
  });
}

/* ---------- 시간표 ---------- */
async function loadTimetable(){
  const now = new Date();
  const dowKey = DAY_KEYS[now.getDay()];
  const dateKey = todayStr();
  const overrideSnap = await db.ref('timetableOverride/'+dateKey).once('value');
  const override = overrideSnap.exists() ? overrideSnap.val().periods : null;
  const list = document.getElementById('todayPeriodList');
  if(!WEEK_KEYS.includes(dowKey) && !override){ list.innerHTML='<li class="tt-empty">오늘은 수업이 없는 날이에요.</li>'; return; }
  let periods;
  if(override){ periods = override; }
  else{
    const wSnap = await db.ref('timetableWeekly/'+dowKey).once('value');
    periods = wSnap.exists() ? (wSnap.val().periods || []) : [];
  }
  const filled = periods.map((v,i)=>({idx:i+1,val:v})).filter(p=>p.val && p.val.trim());
  list.innerHTML = filled.length ? filled.map((p,i)=>`<li class="period-chip" style="background:var(--${CHIP_COLORS[i%CHIP_COLORS.length]});"><span class="p-badge">${p.idx}</span><span class="p-subject">${escapeHtml(p.val)}</span></li>`).join('') : '<li class="tt-empty">등록된 시간표가 없습니다.</li>';
}

/* ---------- 퀴즈 ---------- */
async function loadQuiz(){
  const qEl = document.getElementById('quizQuestion');
  const cEl = document.getElementById('quizChoices');
  const rEl = document.getElementById('quizRaw');
  const drawBtn = document.getElementById('openDrawBtn');
  rEl.textContent = ''; drawBtn.style.display = 'none';
  if(!quizDb){
    qEl.textContent = 'index.html 상단의 QUIZ_FIREBASE_CONFIG 값을 채워주세요.';
    cEl.innerHTML = '';
    return;
  }
  try{
    let snap = await quizDb.ref('quizzes/'+todayStr()).once('value');
    if(!snap.exists()) snap = await quizDb.ref('quizzes/'+todayStrCompact()).once('value');
    if(!snap.exists()){ qEl.textContent = '오늘의 퀴즈가 아직 등록되지 않았습니다.'; cEl.innerHTML=''; return; }
    const data = snap.val();
    const question = (data.meta && data.meta.questionText) || data.question || data.title || data.text || data.q || null;
    const choices = data.choices || data.options || data.answers || [];
    if(question){
      qEl.textContent = question;
      cEl.innerHTML = Array.isArray(choices) && choices.length ? choices.map(c=>`<div class="quiz-choice">${escapeHtml(String(c))}</div>`).join('') : '';
      drawBtn.style.display = 'inline-block';
    } else {
      qEl.textContent = '(문제 필드명을 확인해주세요 - 아래 원본 데이터 참고)';
      rEl.textContent = JSON.stringify(data, null, 2);
    }
  }catch(e){ console.error(e); qEl.textContent = '퀴즈를 불러오지 못했습니다. (' + (e && e.message ? e.message : e) + ')'; }
}

function shrinkToFit(el, opts){
  opts = opts || {};
  const max = opts.max || 13.5;
  const min = opts.min || 9;
  let size = max;
  el.style.fontSize = size + 'px';
  let guard = 0;
  while(el.scrollHeight > el.clientHeight && size > min && guard < 20){
    size -= 0.5;
    el.style.fontSize = size + 'px';
    guard++;
  }
}

/* ---------- 오늘의 할 일 ---------- */
async function loadTodos(){
  const snap = await db.ref('todos/'+todayStr()).once('value');
  const text = snap.val() || '';
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const box = document.getElementById('todoSection');
  const rows = lines.length ? lines : [''];
  box.innerHTML = rows.map(l=>`<div class="todo-row"><input type="checkbox" class="todo-check"><span class="todo-text">${escapeHtml(l)}</span></div>`).join('');
}

/* ---------- 급식 (NEIS) ---------- */
let mealDate = new Date();
async function loadMeal(){
  const bodyEl = document.getElementById('mealBody');
  document.getElementById('mealDateLabel').textContent = `${mealDate.getMonth()+1}월 ${mealDate.getDate()}일`;
  const cfgSnap = await db.ref('config/neis').once('value');
  const cfg = cfgSnap.val();
  if(!cfg || !cfg.officeCode || !cfg.schoolCode){
    bodyEl.innerHTML = '<div class="meal-empty">🌤️ 관리자 페이지에서<br>학교를 등록해주세요.</div>';
    return;
  }
  bodyEl.innerHTML = '<div class="meal-loading">불러오는 중...</div>';
  try{
    const dateCompact = todayStrCompact(mealDate);
    const keyParam = cfg.apiKey ? `&KEY=${encodeURIComponent(cfg.apiKey)}` : '';
    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json${keyParam}&ATPT_OFCDC_SC_CODE=${cfg.officeCode}&SD_SCHUL_CODE=${cfg.schoolCode}&MLSV_YMD=${dateCompact}`;
    const res = await fetch(url);
    const json = await res.json();
    const rows = json && json.mealServiceDietInfo && json.mealServiceDietInfo[1] && json.mealServiceDietInfo[1].row;
    if(!rows || !rows.length){ bodyEl.innerHTML = '<div class="meal-empty">🍽️ 이 날은<br>급식 정보가 없어요.</div>'; return; }
    const items = rows[0].DDISH_NM.split('<br/>').map(s=>s.replace(/\([0-9.]+\)/g,'').trim()).filter(Boolean);
    bodyEl.innerHTML = '<ul class="meal-list">' + items.map(i=>`<li>${escapeHtml(i)}</li>`).join('') + '</ul>';
    shrinkToFit(bodyEl, {max:13.5, min:9});
  }catch(e){
    bodyEl.innerHTML = '<div class="meal-empty">⚠️ 급식 정보를<br>가져오지 못했어요.</div>';
  }
}
document.getElementById('mealPrevBtn').addEventListener('click', ()=>{ mealDate = new Date(mealDate.getFullYear(), mealDate.getMonth(), mealDate.getDate()-1); loadMeal(); });
document.getElementById('mealNextBtn').addEventListener('click', ()=>{ mealDate = new Date(mealDate.getFullYear(), mealDate.getMonth(), mealDate.getDate()+1); loadMeal(); });
document.getElementById('mealTodayBtn').addEventListener('click', ()=>{ mealDate = new Date(); loadMeal(); });

/* ---------- D-Day ---------- */
async function loadDday(){
  const snap = await db.ref('config/dday').once('value');
  const cfg = snap.val();
  const el = document.getElementById('ddayWidget');
  if(!cfg || !cfg.date || !cfg.label){ el.style.display = 'none'; return; }
  const target = new Date(cfg.date+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((target - now) / 86400000);
  let text;
  if(diffDays > 0) text = `${cfg.label} D-${diffDays}`;
  else if(diffDays === 0) text = `${cfg.label} D-DAY`;
  else text = `${cfg.label} D+${Math.abs(diffDays)}`;
  el.textContent = '🎈 ' + text;
  el.style.display = 'inline-block';
}

/* ---------- 그려서 답안 제출 (작은 하단 패널, 배경 안 가림) ---------- */
const drawOverlay = document.getElementById('drawOverlay');
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');
let selectedStudent = null;
let drawing = false;

function resetCanvas(){
  drawCtx.fillStyle = '#ffffff';
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.lineWidth = 4;
  drawCtx.strokeStyle = '#4a4458';
}
function getPos(e){
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
drawCanvas.addEventListener('pointerdown', (e)=>{
  drawing = true;
  drawCanvas.setPointerCapture(e.pointerId);
  const p = getPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(p.x, p.y);
});
drawCanvas.addEventListener('pointermove', (e)=>{
  if(!drawing) return;
  const p = getPos(e);
  drawCtx.lineTo(p.x, p.y);
  drawCtx.stroke();
});
function stopDrawing(){ drawing = false; }
drawCanvas.addEventListener('pointerup', stopDrawing);
drawCanvas.addEventListener('pointerleave', stopDrawing);

async function openDrawOverlay(){
  const roster = await getRosterList();
  const answeredSnap = await db.ref('quizAnswers/'+todayStr()).once('value');
  const answered = answeredSnap.val() || {};
  const grid = document.getElementById('drawNameGrid');
  grid.innerHTML = roster.length ? roster.map(s=>{
    const done = !!answered[s.id];
    return done
      ? `<button class="name-pill done" disabled>${escapeHtml(s.name)}</button>`
      : `<button class="name-pill" data-id="${s.id}" data-name="${escapeHtml(s.name)}">${escapeHtml(s.name)}</button>`;
  }).join('') : '<p style="color:var(--muted); font-size:13px;">등록된 학생이 없습니다.</p>';
  grid.querySelectorAll('.name-pill:not(.done)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedStudent = { id: btn.dataset.id, name: btn.dataset.name };
      document.getElementById('drawingForLabel').textContent = `✏️ ${selectedStudent.name}님`;
      document.getElementById('drawStepName').style.display = 'none';
      document.getElementById('drawStepCanvas').style.display = 'block';
      resetCanvas();
    });
  });
  document.getElementById('drawStepName').style.display = 'block';
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepDone').style.display = 'none';
  drawOverlay.classList.add('open');
}
document.getElementById('openDrawBtn').addEventListener('click', openDrawOverlay);
document.getElementById('closeDrawOverlay').addEventListener('click', ()=> drawOverlay.classList.remove('open'));
document.getElementById('backToNameBtn').addEventListener('click', ()=>{
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepName').style.display = 'block';
});
document.getElementById('clearCanvasBtn').addEventListener('click', resetCanvas);
document.getElementById('submitDrawingBtn').addEventListener('click', async ()=>{
  if(!selectedStudent) return;
  const dataUrl = drawCanvas.toDataURL('image/jpeg', 0.82);
  await db.ref(`quizAnswers/${todayStr()}/${selectedStudent.id}`).set({
    name: selectedStudent.name, dataUrl, submittedAt: Date.now()
  });
  document.getElementById('drawStepCanvas').style.display = 'none';
  document.getElementById('drawStepDone').style.display = 'block';
  setTimeout(()=>{ drawOverlay.classList.remove('open'); }, 1300);
});

async function loadAll(){
  await Promise.all([loadTimetable(), loadQuiz(), loadDday(), loadMeal(), loadTodos()]);
  if(openPanelType === 'attendance') await renderAttendancePanel();
  else if(openPanelType === 'morning' || openPanelType === 'closing') await renderNoticePanel(openPanelType);
}
if(initFirebase()){
  loadAll();
  setInterval(loadAll, 5*60*1000);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
